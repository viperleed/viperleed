# Advisory check: runs the pre-commit hooks (see .pre-commit-config.yaml)
# on the files a pull request changes, e.g., to flag copyright end years
# that are out of date. This check is advisory only: do NOT make it a
# required status check, so that it never blocks merging a pull request.
name: Pre-commit (advisory)

on: pull_request

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Run pre-commit on the files changed by the pull request
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        pre-commit run --from-ref "origin/$BASE_REF" --to-ref HEAD --show-diff-on-failure
