# Tests: the default test tier (pytest's addopts select
# -m "not tensorleed", slow tests included) on every pull request and
# on every push to master. The TensErLEED-dependent tests run in
# tensorleed_tests.yml instead.
#
# - The tests run with pytest-xdist and --require-all: gfortran and
#   mpifort are installed, and a test that would skip for lack of one
#   fails instead. PyQt5 is installed too, but no test needs it.
# - Python versions: the oldest offered by actions/setup-python on
#   ubuntu-latest, and the newest on which the default tier passes.
#   Python 3.13 and later still fail some tests.
# - Coverage is uploaded to Codecov from the newest-Python job. This
#   needs the Codecov app and the CODECOV_TOKEN secret. A failed upload
#   does not fail the job.
# - Require the check "Tests" (job all-tests) in the
#   rulesets: it fails unless every job of the matrix succeeded, and
#   its name does not change with the Python versions.
# - On push to master, the job "Tests (serial)" also runs the
#   default tier without pytest-xdist, for tests that fail only when
#   run serially. It is not part of the check on pull requests.

name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # One group per pull request, where a new push cancels the running
  # run; one group per commit otherwise, so no run of a push to master
  # is cancelled or replaced while it waits
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PyQt5 without a display
  QT_QPA_PLATFORM: offscreen

jobs:
  pytest:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        include:
          - python-version: '3.12'
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, and the libraries of PyQt5/mplcairo
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libcairo2-dev pkg-config
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e '.[GUI]'
      - name: Run the default test tier
        env:
          # Coverage only where it is uploaded
          COVERAGE_OPTIONS: ${{ matrix.coverage && '--cov-report=xml' || '--no-cov' }}
        run: pytest tests -n auto --require-all -rfEs $COVERAGE_OPTIONS
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  pytest-serial:
    name: Tests (serial)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, and the libraries of PyQt5/mplcairo
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libcairo2-dev pkg-config
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e '.[GUI]'
      - name: Run the default test tier serially
        run: pytest tests --require-all --no-cov -rfEs

  all-tests:
    # A single, stable check name for the rulesets. Runs even if a
    # matrix job failed or was cancelled, so that it is never skipped.
    name: Tests
    if: ${{ always() }}
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check that every matrix job succeeded
        env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          echo "Matrix result: $RESULT"
          test "$RESULT" = success
