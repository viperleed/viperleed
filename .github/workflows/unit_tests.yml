# Tests: the default test tier (pytest's addopts select
# -m "not tensorleed", slow tests included) on every pull request and
# on every push to master. The TensErLEED-dependent tests run in
# tensorleed_tests.yml instead.
#
# - Three jobs: Linux with the newest Python, Windows with Python 3.7
#   (the oldest supported; actions/setup-python has no 3.7 for
#   ubuntu-latest), and Windows with the same Python as Linux.
#   "Newest" is python-version '3.x': the newest stable Python 3
#   (check-latest: true, not the newest in the runner image), also in
#   "Tests (serial)" and in tensorleed_tests.yml. A new Python release
#   can therefore turn these jobs red until viperleed is fixed for it.
# - The tests run with pytest-xdist and --require-all, so a test that
#   would skip for lack of an optional dependency fails instead. On
#   Linux, gfortran and mpifort are installed. The Windows jobs do
#   not install them: they exempt exactly these two dependencies with
#   --allow-missing=mpifort,gfortran, so the tests that need them run
#   on Linux in any case, and on Windows where the runner image has
#   the compiler (today gfortran, not mpifort). Any other missing
#   dependency still fails.
#   PyQt5 is installed too (the [GUI] extra), as the GUI tests need a
#   Qt binding. They run without a display (QT_QPA_PLATFORM).
# - Coverage is uploaded to Codecov from the Linux job. This needs the
#   Codecov app and the CODECOV_TOKEN secret. A failed upload does not
#   fail the job.
# - Require the check "Tests" (job all-tests) in the
#   rulesets: it fails unless every job of the matrix succeeded, and
#   its name does not change with the operating systems or the Python
#   versions.
# - On push to master, the job "Tests (serial)" also runs the
#   default tier without pytest-xdist (Linux), for tests that fail
#   only when run serially. It is not part of the check on pull
#   requests.

name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # One group per pull request, where a new push cancels the running
  # run; one group per commit otherwise, so no run of a push to master
  # is cancelled or replaced while it waits
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PyQt5 without a display
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    # Also on Windows (Git Bash), so the steps share their syntax
    shell: bash

jobs:
  pytest:
    name: Tests (${{ matrix.platform }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            python-version: '3.x'
            coverage: true
          - platform: Windows
            os: windows-latest
            python-version: '3.7'
            allow-missing: mpifort,gfortran
          - platform: Windows
            os: windows-latest
            python-version: '3.x'
            allow-missing: mpifort,gfortran
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Newest release, not the newest in the runner image's cache
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, and the libraries of PyQt5/mplcairo
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libcairo2-dev pkg-config
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e '.[GUI]'
      - name: Run the default test tier
        env:
          # Coverage only where it is uploaded
          COVERAGE_OPTIONS: ${{ matrix.coverage && '--cov-report=xml' || '--no-cov' }}
          # Optional dependencies that this job does not install
          ALLOW_MISSING_OPTION: ${{ matrix.allow-missing && format('--allow-missing={0}', matrix.allow-missing) || '' }}
        run: >-
          pytest tests -n auto --require-all $ALLOW_MISSING_OPTION -rfEs
          $COVERAGE_OPTIONS
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  pytest-serial:
    name: Tests (serial)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, and the libraries of PyQt5/mplcairo
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libcairo2-dev pkg-config
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e '.[GUI]'
      - name: Run the default test tier serially
        run: pytest tests --require-all --no-cov -rfEs

  all-tests:
    # A single, stable check name for the rulesets. Runs even if a
    # matrix job failed or was cancelled, so that it is never skipped.
    name: Tests
    if: ${{ always() }}
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check that every matrix job succeeded
        env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          echo "Matrix result: $RESULT"
          test "$RESULT" = success
