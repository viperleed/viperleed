# TensErLEED tests: the tests marked tensorleed (pytest -m tensorleed),
# which run viperleed.calc against a TensErLEED tree. They run on every
# pull request into master, and by hand ("Run workflow", any branch).
#
# - Pull requests into master also run the release tests (--release),
#   as master is the release branch. Runs by hand do so only with the
#   input "release" checked.
# - The workflow is selected by its trigger: on pull requests into
#   other branches it does not start. Require the checks "TensErLEED
#   tests" and "TensErLEED tests (Windows)" in the ruleset of master
#   only.
# - Release runs (pull requests into master, and runs by hand with
#   "release" checked) also run the job "TensErLEED tests (Windows)":
#   the same tests, with --release, on windows-latest with gcc,
#   gfortran and LAPACK from MSYS2 (UCRT64). It takes about 35 min.
#   It has no MPI (MSYS2's mpifort fails when started from Python),
#   so the searches there run as a single process.
# - A required check must never pass by being skipped, nor by a run
#   without the release tests. In runs without them (by hand, without
#   "release"), the Linux job is therefore named "TensErLEED tests (no
#   release)". The Windows job is skipped there, and GitHub reports a
#   skipped job under its name unevaluated, expression included: not
#   a required name either. On a pull request into master, both jobs
#   always run under the required names.
# - The tree is assembled by build/scripts/assemble_tensorleed_tree.py
#   and cached on Linux (on Windows, assembling it takes about 15 s).
#   The cache key holds the hashes of the script and of the random_.c
#   it compiles, and the versions of the compilers it uses, as the
#   tree contains objects compiled on the runner.

name: TensErLEED tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: Also run the release tests (--release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One group per pull request, where a new push cancels the running
  # run; one group per commit otherwise, so no run of a push to master
  # is cancelled or replaced while it waits
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-tensorleed:
    # Runs without the release tests get a name no ruleset requires
    name: TensErLEED tests${{ !(github.event_name == 'pull_request' || inputs.release) && ' (no release)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set the location of the TensErLEED tree
        # Outside the checkout. Not github.workspace/..: actions/cache
        # refuses paths that contain '..'
        run: echo "VIPERLEED_TENSORLEED=$RUNNER_TEMP/tensorleed" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, BLAS, and LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libopenblas-dev
      - name: Get the compiler versions
        id: compilers
        run: |
          echo "versions=gcc$(gcc -dumpfullversion)-gfortran$(gfortran -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: Restore the TensErLEED tree
        id: tree-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VIPERLEED_TENSORLEED }}
          key: tensorleed-tree-${{ runner.os }}-${{ steps.compilers.outputs.versions }}-${{ hashFiles('build/scripts/assemble_tensorleed_tree.py', 'doc/_static/tenserleed_windows/random_.c') }}
      - name: Assemble the TensErLEED tree
        if: ${{ steps.tree-cache.outputs.cache-hit != 'true' }}
        run: python build/scripts/assemble_tensorleed_tree.py "$VIPERLEED_TENSORLEED"
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e .
      - name: Run the TensErLEED tests
        env:
          RELEASE_OPTION: ${{ (github.event_name == 'pull_request' || inputs.release) && '--release' || '' }}
        run: pytest tests -m tensorleed -n auto --require-all --no-cov -rfEs $RELEASE_OPTION

  pytest-tensorleed-windows:
    # Skipped, the job reports under this name unevaluated: keep the
    # expression, so that it never reports under the required name
    name: TensErLEED tests (Windows${{ !(github.event_name == 'pull_request' || inputs.release) && ', no release' || '' }})
    if: ${{ github.event_name == 'pull_request' || inputs.release }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash, so the steps share their syntax with the Linux job
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set the location of the TensErLEED tree
        run: echo "VIPERLEED_TENSORLEED=$RUNNER_TEMP/tensorleed" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers and LAPACK (MSYS2, UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-lapack
      - name: Put the UCRT64 compilers first on PATH
        # Ahead of the other gcc/gfortran of the runner image
        run: echo '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' >> "$GITHUB_PATH"
      - name: Show the compiler versions
        run: |
          which gcc gfortran
          echo "gcc$(gcc -dumpfullversion)-gfortran$(gfortran -dumpfullversion)"
      - name: Assemble the TensErLEED tree
        run: python build/scripts/assemble_tensorleed_tree.py "$VIPERLEED_TENSORLEED"
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e .
      - name: Run the TensErLEED tests
        run: pytest tests -m tensorleed -n auto --require-all --no-cov -rfEs --release
